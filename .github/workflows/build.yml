name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build Vigil.app
        run: bash scripts/build.sh

      - name: Smoke test (diagnose runs and exits)
        run: ./build/Vigil.app/Contents/MacOS/Vigil --diagnose || true

      - name: Zip app
        run: ditto -c -k --keepParent build/Vigil.app build/Vigil.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vigil-app
          path: build/Vigil.app.zip
